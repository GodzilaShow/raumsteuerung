# Baut die Android-App "Raumsteuerung Kiosk" und stellt sie als Release "kiosk-latest" bereit.
# Bei einem Fehler: Release "kiosk-build-fehler" mit dem Ende des Build-Logs.
name: Kiosk-APK
on:
  push:
    paths: ['android-kiosk/**', '.github/workflows/kiosk-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK bauen
        working-directory: android-kiosk
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk ../raumkiosk.apk
      - name: Release kiosk-latest
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete kiosk-latest -y --cleanup-tag || true
          gh release delete kiosk-build-fehler -y --cleanup-tag || true
          sha=$(sha256sum raumkiosk.apk | cut -d' ' -f1)
          gh release create kiosk-latest raumkiosk.apk --target "${{ github.sha }}" --title "Raumsteuerung Kiosk 1.${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} von ${{ github.sha }}. SHA-256: $sha" --prerelease
      - name: Fehler melden
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete kiosk-build-fehler -y --cleanup-tag || true
          { echo "Build ${{ github.run_number }} fehlgeschlagen. Ende des Logs:"; echo '```'; tail -c 60000 android-kiosk/build.log 2>/dev/null || echo "kein Log"; echo '```'; } > fehler.md
          gh release create kiosk-build-fehler --target "${{ github.sha }}" --title "Kiosk-Build fehlgeschlagen (${{ github.run_number }})" --notes-file fehler.md --prerelease
