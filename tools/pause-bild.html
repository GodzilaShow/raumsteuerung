<!doctype html>
<!-- Vorlage für Raumsteuerung/pause.png (1920x1080): Pausenbild auf den Displays (Raumsteuerung.exe, „Pausenbild zeigen“).
     Dunkel, damit zwei 98-Zoll-Displays den Raum nicht hell anstrahlen. Kein Text, nur das Emsland-Zeichen.
     Erzeugen: im Browser bei 1920x1080 als PNG speichern, z. B. mit Playwright. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{position:relative;background:#0B3A5B}
svg.w{position:absolute;inset:0}
.logo{position:absolute;left:50%;top:50%;height:260px;transform:translate(-50%,-50%);clip-path:inset(0 4px 0 0)}
.stripe{position:absolute;left:0;right:0;bottom:0;height:22px;background:#8DC63F;clip-path:polygon(0 80%,100% 0,100% 100%,0 100%)}
</style></head><body>
<svg class="w" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="2">
 <path d="M-50 980 C 400 820, 900 1060, 1400 900 S 2000 760, 2000 760"/>
 <path d="M-50 1030 C 450 880, 950 1100, 1450 950 S 2000 820, 2000 820"/>
 <path d="M-50 120 C 500 260, 1000 20, 1500 160 S 2000 300, 2000 300"/>
</svg>
<img class="logo" src="../Raumsteuerung/emsland-logo.png">
<div class="stripe"></div>
</body></html>
