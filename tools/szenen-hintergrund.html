<!doctype html><html><head><meta charset="utf-8"><style>
<!-- Vorlage für Raumsteuerung/szenen-hintergrund.png (1920x1080): im Browser bei 1920x1080 als PNG speichern, z. B. mit Playwright. -->
@font-face{font-family:SS3;src:local("Source Sans 3") format('woff2');font-weight:200 900}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{position:relative;font-family:SS3,sans-serif;background:#0B3A5B}
/* dezente Linien wie Wellen, sehr schwach */
svg.w{position:absolute;inset:0}
.head{position:absolute;left:36px;top:18px;height:54px;display:flex;align-items:center;gap:18px;color:#fff}
.head img{height:52px}
.head .lk{font-size:25px;line-height:1.02;font-weight:600;color:#fff}
.head .sep{width:1px;height:40px;background:rgba(255,255,255,.35)}
.head .rm{font-size:25px;font-weight:600;color:rgba(255,255,255,.9)}
.head .rm small{display:block;font-size:17px;font-weight:400;color:rgba(255,255,255,.6)}
.stripe{position:absolute;left:0;right:0;bottom:0;height:22px;background:#8DC63F;clip-path:polygon(0 80%,100% 0,100% 100%,0 100%)}
</style></head><body>
<svg class="w" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="2">
 <path d="M-50 980 C 400 820, 900 1060, 1400 900 S 2000 760, 2000 760"/>
 <path d="M-50 1030 C 450 880, 950 1100, 1450 950 S 2000 820, 2000 820"/>
 <path d="M-50 120 C 500 260, 1000 20, 1500 160 S 2000 300, 2000 300"/>
</svg>
<div class="head"><img src="../Raumsteuerung/emsland-logo.png"><div class="lk">Landkreis<br>Emsland</div></div>
<div class="stripe"></div>
</body></html>
